<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d1117" />
<title>2027 세무직 누적 학습 노트</title>
<meta name="description" content="2027년 9급 세무직(국가직) 대비 세법·회계학·국어·영어 누적 학습 카드" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">📚</span>
    <span class="brand-text">2027 세무직 누적 학습 노트</span>
  </div>
  <button class="icon-btn" id="themeToggle" type="button" aria-label="다크/라이트 모드 전환" title="다크/라이트 모드">
    <span id="themeIcon">🌙</span>
  </button>
</header>

<section class="hero">
  <div class="hero-top">
    <div class="dday-box">
      <span class="dday-label">2027 국가직 9급 필기</span>
      <strong class="dday-value" id="ddayValue">D-129</strong>
      <span class="dday-date">2027. 03. 27 (토)</span>
    </div>
    <div class="hero-count">
      <span class="count-label">남은 시간</span>
      <span class="count-value" id="countdown">--일 --:--:--</span>
    </div>
  </div>
  <div class="stats" id="stats">
    <span class="stat"><b id="statTotal">0</b><i>전체 카드</i></span>
    <span class="stat"><b id="statDone">0</b><i>복습 완료</i></span>
    <span class="stat"><b id="statStar">0</b><i>별표</i></span>
    <span class="stat"><b id="statWeak">0</b><i>복습 대기</i></span>
  </div>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
</section>

<nav class="tabs" id="tabs" aria-label="과목 선택"></nav>

<section class="controls">
  <div class="search-row">
    <div class="search-box">
      <span class="search-icon">🔎</span>
      <input id="searchInput" type="search" inputmode="search" autocomplete="off"
             placeholder="키워드 검색 (예: 상각부인액, 기부금, 대우)" aria-label="키워드 검색" />
      <button class="clear-btn" id="searchClear" type="button" aria-label="검색어 지우기" hidden>✕</button>
    </div>
    <select id="dateFilter" aria-label="학습일 필터"></select>
  </div>
  <div class="chips" id="chips">
    <button class="chip is-active" data-filter="all" type="button">전체</button>
    <button class="chip" data-filter="weak" type="button">복습 대기</button>
    <button class="chip" data-filter="star" type="button">★ 별표만</button>
  </div>
  <p class="result-line"><span id="resultCount">0</span>개 카드 <button class="link-btn" id="resetFilters" type="button">필터 초기화</button></p>
</section>

<main id="cards" class="cards"></main>
<div class="empty" id="emptyState" hidden>
  <p class="empty-emoji">🗂️</p>
  <p>조건에 맞는 카드가 없어.</p>
  <button class="btn" id="emptyReset" type="button">필터 초기화</button>
</div>

<footer class="foot">
  <p><b>복습 팁</b> · 카드를 눌러 접고 펼 수 있어. <b>복습 완료</b>를 누르면 진행률에 반영돼.</p>
  <p class="foot-dim" id="footUpdated"></p>
</footer>

<button class="fab" id="quizOpen" type="button" aria-haspopup="dialog">
  <span>🎯</span> OX 복습
</button>

<div class="modal" id="quizModal" hidden role="dialog" aria-modal="true" aria-labelledby="quizTitle">
  <div class="modal-sheet">
    <div class="modal-head">
      <h2 id="quizTitle">🎯 OX 복습</h2>
      <button class="icon-btn" id="quizClose" type="button" aria-label="닫기">✕</button>
    </div>
    <div class="quiz-body" id="quizBody"></div>
  </div>
</div>

<script src="data/items-tax.js"></script>
<script src="data/items-accounting.js"></script>
<script src="data/items-korean.js"></script>
<script src="data/items-english.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
